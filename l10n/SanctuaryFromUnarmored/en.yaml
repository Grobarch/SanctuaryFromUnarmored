pageName: Sanctuary From Unarmored

# --- Balance -----------------------------------------------------------------------------
settingsGroup: Balance
settingsGroupDescription: |-
  One Sanctuary point = one percentage point off the attacker's chance to hit.
  The line under each slider is live and recalculates as you drag.

maxSanctuary: Maximum Sanctuary
maxSanctuaryDescription: Hard ceiling on the bonus, whatever the curve below produces.

threshold: Skill threshold
thresholdDescription: Skill level at which the bonus starts.

rate: Points per skill level
rateDescription: Sanctuary points per skill level above the threshold.

npcFactor: NPC share
npcFactorDescription: |-
  What NPCs get compared to you. The effect is passive, so it also applies NPC against NPC.

arMultiplier: Armour rating multiplier
arMultiplierDescription: |-
  Scales the Unarmored part of armour rating; 1.00x is vanilla, and only empty slots count.
  Raising it does NOT make NPCs strip their armour - the game settings stay untouched.

dodgeXpScale: Skill gain from dodging
dodgeXpScaleDescription: |-
  Unarmored normally improves only when you get hit, so a working dodge slows down its own
  progression. This trains it on a missed attack too, scaled against a blow that landed.
  0 turns it off. With NCG this also feeds attribute growth, so it is not cosmetic.

statsWindow: Show in stats window
statsWindowDescription: Adds a Dodge line to Stats Window Extender, with a per-slot tooltip.

inventoryBar: Show on the inventory bar
inventoryBarDescription: Adds the bonus next to armour rating on Inventory Extender's bar.

# --- Armour coverage ---------------------------------------------------------------------
armourGroup: Armour coverage
armourGroupDescription: |-
  How much of the Unarmored bonus survives on a covered slot. Slots carry their vanilla armour
  rating weights: cuirass 30%, shield / helmet / greaves / boots / each pauldron 10%, each
  gauntlet 5%. A cuirass is therefore worth three helmets, and all nine add up to the whole
  bonus.

keepLight: Kept in light armour
keepLightDescription: Share a covered slot still provides, scored from Light Armour.

keepMedium: Kept in medium armour
keepMediumDescription: Same, for medium armour.

keepHeavy: Kept in heavy armour
keepHeavyDescription: Same, for heavy armour. Zero removes the bonus from that slot.

useArmorSkill: Armour proficiency matters
useArmorSkillDescription: |-
  Evasion always comes from Unarmored - armour skills never produce it on their own, so
  a guard in full armour with no Unarmored training dodges nothing either way.
  On: how well you handle the armour you wear scales what survives, reaching the full share
  above at skill 100 and half of it at 50.
  Off: only the shares above matter, and the armour skill is ignored entirely.

# --- Update frequency --------------------------------------------------------------------
perfGroup: Update frequency
perfGroupDescription: |-
  Nothing here runs every frame. The engine has no "item equipped" event, so equipment is
  polled - cheaply, and a full recalculation only fires when something actually changed.

refreshInterval: Player - full recalculation (s)
refreshIntervalDescription: |-
  Covers skill changes (training, fortify, drain) and equipment. Equipment is additionally
  watched by a cheap check five times as often, derived from this value.

npcPeriodicRefresh: Periodic updates for NPCs
npcPeriodicRefreshDescription: |-
  Turn off in crowded areas: NPCs then update only when they become active, at no per-frame
  cost. Only reacting to armour they swap mid-fight is lost.

npcRefreshInterval: NPC - full recalculation (s)
npcRefreshIntervalDescription: Ignored when periodic updates for NPCs are off.

# --- Removal -----------------------------------------------------------------------------
removalGroup: Removal
removalGroupDescription: |-
  Only needed when you are deleting the mod. The ability it grants is applied by a script, so
  while the mod is gone nothing is left to take it off again.

uninstallMode: Remove this mod's effects
uninstallModeDescription: |-
  Switches everything off - no bonus, armour rating back to vanilla, no skill gain from
  dodging - and strips the ability from you and from every actor currently loaded. Press it,
  save, and the mod is safe to delete.
  Nobody else in the world is carrying it: the bonus is taken off actors as they leave your
  surroundings, so it only ever exists near you.
uninstallModeOff: Remove now
uninstallModeOn: Undo - turn the mod back on
uninstallModeNote: Effects are off. Save now, then delete the mod.

# --- Messages ------------------------------------------------------------------------------
msg_removalDone: "Sanctuary From Unarmored: bonus taken off {count} nearby actors. Save now, then delete the mod."

